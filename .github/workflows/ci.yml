name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Base requirements only: no torch/transformers/streamlit, so the suite proves the core runs without
      # them (dashboard tests skip themselves here and run in the job below).
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest
        working-directory: backend

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
      - run: pip install -r backend/requirements.txt -r frontend/requirements.txt pytest
      - run: python -m pytest tests/test_dashboard.py
        working-directory: backend
