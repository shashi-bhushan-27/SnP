# Curated library of market-moving events for the historical-analog scenario engine.
#   date        first US trading session that could react (news after the close or on a weekend -> next session)
#   title       neutral, headline-style description of the EVENT only - never its market outcome ("...and stocks
#               plunge"), so the back-test cannot read the answer from the question
#   event_type  PRISM taxonomy
# Realised market reactions are NOT typed in by hand: scripts/build_analog_library.py computes them from
# S&P 500 closes (Yahoo Finance), the 10-year Treasury yield (FRED DGS10) and the Baa-Treasury credit spread
# (FRED BAA10Y), and writes backend/config/analog_library.json.
