# Source adapter settings. Secrets (NEWSAPI_KEY) come from the environment, never from here.
#
# Rate-limit notes (verified Oct 2026):
#   GDELT DOC 2.0  ~1 request / 5 s per IP, and a 429 can block the IP for a minute or more.
#                  The index refreshes every ~15 min, so polling faster than that adds nothing.
#   NewsAPI free   100 requests/day, articles delayed 24 h, development use only.
gdelt:
  timespan: 1h
  max_records: 75
  queries:
    - '("stock market" OR earnings OR "interest rates" OR inflation OR sanctions OR tariffs OR bankruptcy) sourcelang:english'
    - '(Apple OR Microsoft OR Nvidia OR Tesla OR Amazon OR Alphabet OR Meta OR JPMorgan) sourcelang:english'

gdelt_gkg:
  # GDELT raw Global Knowledge Graph files (static 15-minute downloads, ~6 MB zipped, ~1,400 articles).
  # Used instead of the DOC API when that one is rate-limited. Keep articles tagged with these themes:
  theme_prefixes: [ECON_STOCKMARKET, ECON_INTEREST_RATES, ECON_INFLATION, ECON_DEBT, ECON_BANKRUPTCY,
                   ECON_CENTRALBANK, ECON_CURRENCY, ECON_OILPRICE, ECON_EARNINGSREPORT, ECON_IPO, ECON_TRADE,
                   ECON_FREETRADE, ECON_MERGERS, SANCTIONS, CYBER_ATTACK]
  max_files_per_fetch: 4

newsapi:
  query: '(stocks OR earnings OR "interest rates" OR inflation OR merger OR bankruptcy OR sanctions)'
  language: en
  page_size: 50
  # Searching full article content pulls in sports/entertainment stories that mention "earnings";
  # restrict matching to title + description and to finance outlets. Measured on live data (Oct 2026):
  # without the domain list ~half the results were aggregator/entertainment noise; with it, results come
  # from CNBC / Business Insider / Fortune / Bloomberg but are 1-3 days old. Set domains: [] to widen.
  search_in: title,description
  domains: [cnbc.com, marketwatch.com, finance.yahoo.com, reuters.com, bloomberg.com, wsj.com, ft.com,
            apnews.com, fortune.com, businessinsider.com, forbes.com, investing.com, barrons.com, thestreet.com]

replay:
  file: data/replay/sample_news.jsonl   # relative to the repo root
